<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Klixa - skins camera (suivi)</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="tracker">
<canvas id="stage"></canvas>
<canvas id="stage3d"></canvas>
<canvas id="stagedebug"></canvas>
<video id="cam" playsinline muted></video>
<div id="ui">
  <select id="device"></select>
  <select id="skin"></select>
  <label><input type="checkbox" id="mirror" checked> Miroir</label>
  <label><input type="checkbox" id="body" checked> Corps</label>
  <label><input type="checkbox" id="debug"> Points</label>
  <span id="status">...</span>
</div>
<details id="calib" hidden>
  <summary>Calibrage 3D</summary>
  <div id="calib-body"></div>
  <div id="calib-actions">
    <label><input type="checkbox" id="calib-debug"> Voir le cache de tete</label>
    <button type="button" id="calib-copy">Copier le manifeste</button>
    <button type="button" id="calib-reset">Reinitialiser</button>
  </div>
</details>
<script type="module" src="/tracker.js"></script>
</body>
</html>
