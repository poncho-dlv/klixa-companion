name: Publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de la release existante (ex. v0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache du binaire Electron
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-win-${{ hashFiles('package-lock.json') }}
      # Le téléchargement d'Electron (releases GitHub) renvoie parfois des 504 :
      # on le fait ici avec des retries plutôt qu'au premier require('electron') des tests.
      - name: Télécharger Electron (retries)
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            node node_modules/electron/install.js && exit 0
            echo "Tentative $i échouée, nouvel essai dans 30 s"; sleep 30
          done
          exit 1
      - run: npm test
      - run: npm run dist:win
      - name: Attacher les binaires a la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $assets = @(
            (Get-ChildItem 'release/Klixa-Companion-Setup-*.exe').FullName
            (Get-ChildItem 'release/Klixa-Companion-Setup-*.exe.blockmap').FullName
            (Resolve-Path 'release/latest.yml').Path
          )
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --title "Klixa Companion $env:RELEASE_TAG" --generate-notes --draft
          }
