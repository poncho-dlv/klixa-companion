name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (historique complet) requis par gitleaks-action ci-dessous
      # pour déterminer la plage de commits à scanner.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Secrets committés (clés API, tokens...). Scanne uniquement les commits
      # ajoutés par ce push/PR (pas tout l'historique à chaque run) — gratuit pour
      # un compte personnel, une licence n'est requise que pour un compte
      # organisation GitHub (cf. README gitleaks-action).
      - name: Secrets committés (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache du binaire Electron
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-linux-${{ hashFiles('package-lock.json') }}
      - name: Télécharger Electron (retries)
        run: |
          for i in 1 2 3 4 5 6; do
            node node_modules/electron/install.js && exit 0
            echo "Tentative $i échouée, nouvel essai dans 30 s"; sleep 30
          done
          exit 1

      # eslint-plugin-sonarjs (bugs probables : identifiants non définis, arité
      # d'appel incorrecte, ReDoS...) + no-unsanitized sur le renderer Electron
      # (contexte navigateur, pas de bundler). Voir eslint.config.js.
      - name: Lint (ESLint + sonarjs)
        run: npm run lint

      # Remplace `npm test` : mêmes tests (node --test), + couverture de lignes/
      # fonctions/branches gardée au-dessus d'un plancher (.c8rc.json), fixé sous
      # la couverture actuelle pour attraper une régression nette plutôt qu'imposer
      # un seuil arbitraire.
      - name: Lancer les tests (+ couverture)
        run: npm run test:coverage

      # Fichiers/exports/dépendances jamais utilisés. "files"/"dependencies"/
      # "unlisted" bloquent (peu de bruit, quasi toujours un vrai oubli) ;
      # "exports"/"duplicates" restent en warn (cf. knip.json — surface d'API
      # protocolaire volontairement gardée).
      - name: Code mort (knip)
        run: npm run knip

      # Duplication de code. Seuil légèrement au-dessus de la baseline mesurée
      # (~0.7%) pour attraper une dérive, pas les similitudes structurelles
      # normales entre pages de config similaires (cf. .jscpd.json).
      - name: Duplication de code (jscpd)
        run: npm run dup

      # Vulnérabilités des dépendances de prod uniquement (les dev deps, ex.
      # electron-builder, ne sont pas embarquées
      # dans l'app packagée).
      - name: Audit des dépendances (high+)
        run: npm audit --omit=dev --audit-level=high

  windows-installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache du binaire Electron
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-win-${{ hashFiles('package-lock.json') }}
      # Le téléchargement d'Electron (releases GitHub) renvoie parfois des 504 :
      # on le fait ici avec des retries plutôt qu'au premier require('electron') des tests.
      - name: Télécharger Electron (retries)
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            node node_modules/electron/install.js && exit 0
            echo "Tentative $i échouée, nouvel essai dans 30 s"; sleep 30
          done
          exit 1
      - run: npm test
      - name: Cache electron-builder (NSIS, 7zip)
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron-builder/Cache
          key: electron-builder-win-${{ hashFiles('package-lock.json') }}
      # Les outils d'empaquetage sont téléchargés depuis les releases GitHub (504 intermittents).
      - name: Construire l'installeur Windows (retries)
        shell: bash
        run: |
          for i in 1 2 3 4; do
            npm run dist:win && exit 0
            echo "Tentative $i échouée, nouvel essai dans 45 s"; sleep 45
          done
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: klixa-companion-windows-unsigned
          path: |
            release/Klixa-Companion-Setup-*.exe
            release/Klixa-Companion-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
